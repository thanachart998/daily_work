<!doctype html>
<html lang="th" data-accent="blue" data-font="anuphan">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>PlanWorkFlow</title>
  <script>
    (function () {
      try {
        var savedTheme = localStorage.getItem('worklog-theme') || 'light';
        var isDark =
          savedTheme === 'dark' ||
          (savedTheme === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
        }
        var savedAccent = localStorage.getItem('worklog-accent') || 'blue';
        document.documentElement.setAttribute('data-accent', savedAccent);
        var savedFont = localStorage.getItem('worklog-thai-font') || 'anuphan';
        document.documentElement.setAttribute('data-font', savedFont);
      } catch (e) { }
    })();
  </script>
</head>

<body class="bg-ios-bg text-ios-primary antialiased selection:bg-accent-tint selection:text-accent">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
